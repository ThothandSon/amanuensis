name: Build & Test Cross-Platform (Linux, macOS, Windows)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-core-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Amanuensis Core & Desktop Tests
        run: cargo test --workspace
      - name: Verify Project Harness Initialization
        run: cargo run -p amanuensis-desktop -- --init-harness ci-sample-project
