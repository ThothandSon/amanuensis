name: Amanuensis CI/CD — Linters, Cross-Platform Tests, Coverage & Release Verification

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    name: Linters & Static Analysis (Rust fmt/clippy + TypeScript/Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable with rustfmt & clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Run Rust Clippy linter (zero warnings allowed)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: TypeScript Strict Typecheck & Frontend Production Bundle
        run: |
          npx tsc --noEmit
          npm run build

  rust-core-tests:
    name: Cross-Platform Unit & E2E Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Amanuensis Core & Desktop Tests (40+ E2E & Unit Suite)
        run: cargo test --workspace

      - name: Verify Project Harness CLI Initialization
        run: cargo run -p amanuensis-desktop -- --init-harness ci-sample-project

  code-coverage-check:
    name: Code Coverage Gate & LCOV Report (cargo-llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain with llvm-tools-preview
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Setup Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run Workspace Tests with Coverage Threshold (>= 65% lines)
        run: |
          cargo llvm-cov --workspace --ignore-filename-regex "src-tauri/src/main\.rs" --lcov --output-path lcov.info
          cargo llvm-cov report --ignore-filename-regex "src-tauri/src/main\.rs" --summary-only --fail-under-lines 65

      - name: Upload Coverage Report Artifact (lcov.info)
        uses: actions/upload-artifact@v4
        with:
          name: amanuensis-coverage-lcov
          path: lcov.info

  cd-release-verification:
    name: CD Release Binary & Frontend Bundle Verification
    needs: [lint-and-typecheck, rust-core-tests, code-coverage-check]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Build Production Frontend Bundle
        run: |
          npm ci
          npm run build

      - name: Build LTO-Optimized Stripped Release Binary
        run: |
          cargo build --release -p amanuensis-desktop
          ls -lh target/release/amanuensis-desktop
